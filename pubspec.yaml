version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  get_it: ^9.2.1
  dio: ^5.9.2
  freezed_annotation: ^3.1.0
  flutter_bloc: ^9.1.1
  go_router: ^17.2.3
  fpdart: ^1.2.0
  intl: ^0.20.2
  shimmer: ^3.0.0
  equatable: ^2.0.8
  cached_network_image: ^3.4.1

dev_dependencies:
